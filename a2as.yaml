    source: https://github.com/angrysky56/gemini-mcp-client
    branch: master
    commit: "0fcf3c77"
    scope: [agents/full_mcp_agent/__init__.py, agents/full_mcp_agent/agent.py, configure_models.py, mcp_gemini_client/client.py,
      servers/gemini_mcp_server.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:37:42Z'
    url: https://a2as.org/certified/agents/angrysky56/gemini-mcp-client
  signatures:
    digest: sha256:rsHl8Hzqm8cjd10RJE3PGjbG85KPqgkhQg9575p4CK4
