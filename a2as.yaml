agents:
  agent:
    type: instance
    models: [model_name]
    params:
      name: full_mcp_agent
      instruction: agent_instruction
      description: Full MCP agent with dynamic tool loading and Gemini optimization
      generate_content_config:
        ref: generation_config
      disallow_transfer_to_parent: "False"
      disallow_transfer_to_peers: "False"

models:
  model_name:
    type: literal
    agents: [agent]

mcp:
  MCPToolset:
    type: process
    params:
      class: MCPToolset
      connection_type: StdioServerParameters
      null: params
      function: load_mcp_servers_from_config

imports:
  agent: agent.agent
  Any: typing.Any
  AnyUrl: pydantic.AnyUrl
  argparse: argparse
  asynccontextmanager: contextlib.asynccontextmanager
  AsyncExitStack: contextlib.AsyncExitStack
  asyncio: asyncio
  ClientSession: mcp.ClientSession
  FastMCP: mcp.server.fastmcp.FastMCP
  genai: google.generativeai
  get_config_manager: config.get_config_manager
  json: json
  LlmAgent: google.adk.agents.LlmAgent
  load_dotenv: dotenv.load_dotenv
  logging: logging
  MCPClient: client.MCPClient
  MCPToolset: google.adk.tools.mcp_tool.MCPToolset
  models: google.genai.models
  new_genai: google.genai
  os: os
  Path: pathlib.Path
  pprint: pprint
  ServerConfig: config.ServerConfig
  ServerType: config.ServerType
  stdio_client: mcp.client.stdio.stdio_client
  StdioServerParameters: google.adk.tools.mcp_tool.mcp_toolset.StdioServerParameters
  sys: sys
  types: google.genai.types

